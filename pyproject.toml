[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldenage"
version = "0.1.0"
description = "Operational case management and Wiedervorlage system with HTMX-driven workflows."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "jinja2>=3.1.6,<4.0.0",
  "psycopg[binary]>=3.2.9,<4.0.0",
  "pywin32; sys_platform == 'win32'",
  "python-oxmsg>=0.0.2,<1.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "pywin32>=306; platform_system == 'Windows'",
  "uvicorn>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0.0",
  "pytest>=8.3.5,<9.0.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.11",
  "ty>=0.0.32",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]
exclude = [
  "src/goldenage/adapters/demo.py",
  "src/goldenage/adapters/postgres.py",
  "src/goldenage/adapters/sqlite.py",
  "src/goldenage/bootstrap_postgres.py",
  "src/goldenage/web/app.py",
  "tests/test_web.py",
]

[tool.ty.terminal]
output-format = "concise"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
