name: CI

on:
  pull_request:
  push:
    branches:
      - master

# A newer run for the same pull request or branch makes the earlier result irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Normal quality checks do not need credentials beyond reading the source.
permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.6.14"

      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev

      - name: Run quality checks
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync ty check
          if test -f src/goldenage/migration_validation.py; then
            uv run --no-sync python -m goldenage.migration_validation
          fi
          uv run --no-sync pytest -q

  browser-accessibility:
    name: browser-accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.6.14"

      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev

      - name: Install pinned browser test dependencies
        run: |
          uv pip install --python .venv/bin/python -r tests/browser/requirements.txt
          ./.venv/bin/python -m playwright install --with-deps --only-shell chromium

      - name: Run browser and accessibility gate
        run: uv run --no-sync pytest -q tests/browser

      - name: Upload browser failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-accessibility-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
