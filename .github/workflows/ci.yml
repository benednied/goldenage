name: CI

on:
  pull_request:
  push:
    branches:
      - master

# A newer run for the same pull request or branch makes the earlier result irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Normal quality checks do not need credentials beyond reading the source.
permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.6.14"

      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev

      - name: Run quality checks
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync ty check
          if test -f src/goldenage/migration_validation.py; then
            uv run --no-sync python -m goldenage.migration_validation
          fi
          uv run --no-sync pytest -q
