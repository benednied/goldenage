name: Secret scan

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "00 7 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A pull_request event is intentional: fork code is treated as untrusted, the
# token is read-only, and no repository secrets are made available.
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks history and pull request scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan with redacted output
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
